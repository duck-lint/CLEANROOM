name: Bootstrap kernel scaffold

on:
  push:
    branches:
      - codex/kernel-contract-scaffold
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/kernel-contract-scaffold

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Materialize, validate, and commit scaffold
        shell: bash
        run: |
          cat .bootstrap/payload.part* > /tmp/kernel-scaffold.tar.gz.b64
          base64 --decode /tmp/kernel-scaffold.tar.gz.b64 > /tmp/kernel-scaffold.tar.gz
          test "$(sha256sum /tmp/kernel-scaffold.tar.gz | cut -d' ' -f1)" = "ab26873135c27bdc7ce8f948cbc1bb0bd8c11a7c24eb2ab560c938ecba647178"
          tar -xzf /tmp/kernel-scaffold.tar.gz
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-scaffold.yml
          rm .github/workflows/temporary-kernel-validation.yml

          cargo fmt --all
          cargo generate-lockfile
          cargo run --example export_schemas
          git add -A

          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo run --example export_schemas
          git diff --exit-code
          cargo doc --no-deps

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(kernel): scaffold typed clean-room contracts"
          git push origin HEAD:codex/kernel-contract-scaffold
